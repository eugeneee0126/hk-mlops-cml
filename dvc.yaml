stages:
  process:
    cmd: python process_data.py  # 입력
    deps:
    - process_data.py  # 실행할 파일
    - data_raw.csv     # 사용할 데이터
    outs:
    - data_processed.csv   # 출력값
  train:
    cmd: python train.py
    deps:
    - train.py
    - data_processed.csv
    outs:
    - by_region.png
    metrics:
    - metrics.json:
        cache: false